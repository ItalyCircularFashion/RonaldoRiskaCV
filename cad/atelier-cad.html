<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Atelier CAD, cartamodelli parametrici</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#E9EEF2;--side:#fff;--ink:#12304A;--mut:#5B7186;--line:#CBD6DF;--acc:#0F6E8C;--sa:#C4235F;--fill:rgba(18,48,74,.06);--g1:#D9E2E9;--g2:#BCCAD5;--con:#6F8AA0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101B26;--side:#16242F;--ink:#DDE9F2;--mut:#8DA4B6;--line:#28394A;--acc:#4FB6D6;--sa:#FF7AA8;--fill:rgba(221,233,242,.07);--g1:#1A2A38;--g2:#28394A;--con:#7E9AAF}}
:root[data-theme=dark]{--bg:#101B26;--side:#16242F;--ink:#DDE9F2;--mut:#8DA4B6;--line:#28394A;--acc:#4FB6D6;--sa:#FF7AA8;--fill:rgba(221,233,242,.07);--g1:#1A2A38;--g2:#28394A;--con:#7E9AAF}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.4 'Instrument Sans',system-ui,sans-serif}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{display:grid;grid-template-columns:330px 1fr;height:100%}
aside{background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:18px 18px 28px}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:13px;font-weight:600;margin:22px 0 6px;color:var(--mut)}
.sub{margin:2px 0 12px;color:var(--mut);font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:none;color:var(--ink);padding:9px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--side)}
label{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;margin:9px 0}
label>input[type=range]{grid-column:1/-1;accent-color:var(--acc);width:100%}
input[type=number]{width:64px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
output{color:var(--mut);font-variant-numeric:tabular-nums}
.b{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--side);color:var(--ink);cursor:pointer}
.b:hover{border-color:var(--acc)}
#ex{width:100%;margin-top:18px;background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
td,th{padding:4px 2px;text-align:right;font-weight:400}
th{color:var(--mut)}td:first-child,th:first-child{text-align:left}
.w td{color:var(--sa);font-weight:600}
main{position:relative;min-height:0}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}
#gg *{vector-effect:non-scaling-stroke}
.zb{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
#gs{flex-wrap:wrap}#gs button{flex:1 0 33%}
.tb{position:absolute;left:12px;top:12px;z-index:2;background:var(--side)}.tb button{padding:8px 14px}
select,input[type=file]{max-width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
#v3{position:absolute;inset:0}#v3 canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.hint{position:absolute;left:14px;bottom:10px;margin:0;color:var(--mut);font-size:12px;pointer-events:none}
@media(max-width:760px){html,body,#app{height:auto}#app{grid-template-columns:1fr;grid-template-rows:58vh auto}main{order:-1}aside{border-right:0;border-top:1px solid var(--line)}}
</style>
<style id="sty"></style>
</head>
<body>
<div id="app">
<aside>
<h1>Atelier CAD</h1>
<p class="sub">Cartamodelli parametrici in scala reale. Misure in cm.</p>
<div class="seg" id="gs"><button data-g="gonna" aria-pressed="true">Gonna</button><button data-g="corpetto" aria-pressed="false">Corpetto</button><button data-g="tshirt" aria-pressed="false">T-shirt</button><button data-g="felpa" aria-pressed="false">Felpa</button><button data-g="pantaloni" aria-pressed="false">Pantaloni</button></div>
<h2>Misure del corpo</h2><div id="fm"></div>
<h2>Stile e vestibilità</h2><div id="fs"></div>
<h2>Cartamodello</h2>
<label>Specchia sulla piega (pezzo intero)<input type="checkbox" id="mir" checked></label>
<label>Punti e linee di costruzione<input type="checkbox" id="con"></label>
<label>Margine di cucitura<span><input type="number" id="sa" min="0" max="5" step=".5" value="1"> cm</span></label>
<h2>Immagine sul pezzo</h2>
<label>Pezzo<select id="ip"></select></label>
<input type="file" id="if" accept="image/*" aria-label="Carica un'immagine">
<div id="ic" hidden>
<label>Larghezza (cm)<output id="oiw"></output><input type="range" id="iw" min="4" max="160" step="1"></label>
<label>Rotazione (°)<output id="oir"></output><input type="range" id="ir" min="-180" max="180" step="1"></label>
<label>Sposta in orizzontale (cm)<output id="oix"></output><input type="range" id="ix" min="-40" max="40" step=".5"></label>
<label>Sposta in verticale (cm)<output id="oiy"></output><input type="range" id="iy" min="-40" max="40" step=".5"></label>
<button class="b" id="ib">Rimuovi immagine</button></div>
<div id="mn" hidden>
<h2>Manichino (taglia IT)</h2>
<label>Taglia<select id="ms"><option>40</option><option>42</option><option selected>44</option><option>46</option><option>48</option></select></label>
<div id="mt"></div>
<button class="b" id="ma">Adatta il cartamodello a queste misure</button>
<label>Mostra manichino<input type="checkbox" id="msh" checked></label>
<label>Colore del tessuto<input type="color" id="fc" value="#8fb4cc"></label>
<h2>Drappeggio</h2>
<label>Aderenza al corpo<output id="odcl">60%</output><input type="range" id="dcl" data-d="cl" min="0" max="100" value="60"></label>
<label>Caduta dritta<output id="odhg">50%</output><input type="range" id="dhg" data-d="hg" min="0" max="100" value="50"></label>
<label>Pieghe<output id="odfd">40%</output><input type="range" id="dfd" data-d="fd" min="0" max="100" value="40"></label>
</div>
<h2>Controllo cuciture</h2><div id="ck"></div>
<button class="b" id="ex" hidden>Esporta SVG in scala 1:1</button>
<p id="st" class="sub" role="status"></p>
</aside>
<main>
<svg id="cv" role="img" aria-label="Area di disegno del cartamodello">
<defs>
<pattern id="g1" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" style="stroke:var(--g1)" stroke-width=".03"/></pattern>
<pattern id="g2" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" style="stroke:var(--g2)" stroke-width=".06"/></pattern>
</defs>
<rect x="-2000" y="-2000" width="4000" height="4000" fill="url(#g1)"/>
<rect x="-2000" y="-2000" width="4000" height="4000" fill="url(#g2)"/>
<g id="gg"></g>
</svg>
<div class="seg tb" id="tb"><button data-v="2d" aria-pressed="true">Cartamodello</button><button data-v="3d" aria-pressed="false">Modello 3D</button></div>
<div id="v3" hidden></div>
<p class="hint">Trascina per spostare, rotella per ingrandire. Griglia: 1 cm e 10 cm.</p>
<div class="zb"><button class="b" id="zi" aria-label="Ingrandisci">+</button><button class="b" id="zo" aria-label="Riduci">−</button><button class="b" id="ft">Adatta alla vista</button></div>
</main>
</div>
<script>
const $=s=>document.querySelector(s),f2=v=>+v.toFixed(2),nf=v=>v.toFixed(1).replace('.',',');
// parametri: [chiave, etichetta, valore, min, max, tipo m=misura s=stile]
const PR={
gonna:[['vita','Vita',70,50,130,'m'],['fianchi','Fianchi',96,70,150,'m'],['lung','Lunghezza gonna',58,25,110,'m'],['hd','Altezza fianchi',20,14,26,'m'],['svas','Svasatura all’orlo',0,0,16,'s'],['agio','Agio ai fianchi',4,0,12,'s'],['pince','Quota assorbita dalle pince (%)',60,20,100,'s']],
corpetto:[['petto','Torace',92,70,140,'m'],['vita','Vita',72,50,130,'m'],['ld','Lunghezza dietro',41,36,48,'m'],['sp','Larghezza spalle',38,32,48,'m'],['agio','Agio al torace',6,2,16,'s'],['scollo','Profondità scollo davanti',9,5,18,'s'],['pince','Quota assorbita dalle pince (%)',60,20,100,'s']],
tshirt:[['petto','Torace',92,70,140,'m'],['lung','Lunghezza dal punto spalla',66,45,90,'m'],['sp','Larghezza spalle',40,32,52,'m'],['lm','Lunghezza manica',22,14,40,'m'],['agio','Agio al torace',10,4,24,'s'],['scollo','Profondità scollo davanti',8,4,16,'s'],['omanica','Apertura orlo manica',32,20,44,'s']],
felpa:[['petto','Torace',92,70,140,'m'],['lung','Lunghezza dal punto spalla',68,45,90,'m'],['sp','Larghezza spalle',42,32,52,'m'],['lm','Lunghezza manica',62,40,75,'m'],['agio','Agio al torace',18,8,30,'s'],['scollo','Profondità scollo davanti',9,4,16,'s'],['omanica','Apertura polsino',24,14,34,'s'],['fascia','Altezza fascia e polsino',6,3,12,'s']],
pantaloni:[['vita','Vita',72,50,130,'m'],['fianchi','Fianchi',96,70,150,'m'],['lung','Lunghezza esterna',102,60,120,'m'],['cavallo','Altezza cavallo',27,22,34,'m'],['agio','Agio ai fianchi',6,2,16,'s'],['orlo','Apertura orlo (giro gamba)',38,24,70,'s'],['pince','Quota assorbita dalle pince (%)',60,20,100,'s']]};
const S={g:'gonna',sa:1,mir:true,con:false,v:{}};
for(const k in PR){S.v[k]={};PR[k].forEach(r=>S.v[k][r[0]]=r[2])}
try{const j=JSON.parse(localStorage.atelier);for(const k in j)Object.assign(S.v[k]||{},j[k])}catch(e){}
const save=()=>{try{localStorage.atelier=JSON.stringify(S.v)}catch(e){}if(S.t3)m3()};
let VB,BB,DL;const cv=$('#cv');

// ---- geometria: ogni pezzo = punto iniziale + lati (linea, quadratica o cubica) ----
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function walk(p,f){let a=p.start;for(const e of p.edges){f(e,a);a=e.p[e.p.length-1]}}
function samp(a,e,n=16){const P=[a,...e.p],k=P.length;if(k==2)return P;const o=[a];
 for(let i=1;i<=n;i++){const t=i/n,u=1-t,w=k==3?[u*u,2*u*t,t*t]:[u*u*u,3*u*u*t,3*u*t*t,t*t*t];
  o.push([0,1].map(c=>w.reduce((s,x,j)=>s+x*P[j][c],0)))}return o}
const len=(p,n)=>{let s=0;walk(p,(e,a)=>{if(e.n==n){const q=samp(a,e);for(let i=1;i<q.length;i++)s+=dist(q[i-1],q[i])}});return s};
const poly=p=>{const o=[p.start];walk(p,(e,a)=>o.push(...samp(a,e).slice(1)));o.pop();return o};
// estremi orizzontali della carta a una data altezza (interpolazione sui lati)
const rowSpan=(P,y)=>{let a=1e9,b=-1e9;for(let i=0;i<P.length;i++){const u=P[i],w=P[(i+1)%P.length];
 if((u[1]<=y)!=(w[1]<=y)){const x=u[0]+(y-u[1])*(w[0]-u[0])/(w[1]-u[1]);a=Math.min(a,x);b=Math.max(b,x)}}
 return a>b?null:[a,b]};
// giro di CARTA a una data altezza. Ogni pezzo e' una meta': la copia
// speculare (mirror) e' l'altra meta', quindi il giro e' 2 x semi-larghezza.
// dw = larghezza di EACH dart: una meta' speculare ne contiene due.
const giro=(p,y,dw=0)=>{const s=rowSpan(poly(p),y);return s?2*(s[1]-s[0])-2*dw:0};
// margine di cucitura: offset del poligono con angoli a spigolo; sulla piega (x=0) nessun margine
function off(P,d,cl){const n=P.length;let A=0;P.forEach((q,i)=>{const b=P[(i+1)%n];A+=q[0]*b[1]-b[0]*q[1]});const s=A>0?1:-1;
 const N=(a,b)=>{const x=b[0]-a[0],y=b[1]-a[1],l=Math.hypot(x,y)||1;return[s*y/l,-s*x/l]};
 return P.map((q,i)=>{const n1=N(P[(i+n-1)%n],q),n2=N(q,P[(i+1)%n]),k=d/Math.max(.3,1+n1[0]*n2[0]+n1[1]*n2[1]);
  const x=q[0]+(n1[0]+n2[0])*k;return[cl?Math.max(0,x):x,q[1]+(n1[1]+n2[1])*k]})}

// ---- capi base: formule semplificate di cartamodellistica ----
// NOTA DI SCALA: ogni pezzo e' una META' del capo (etichetta "x1 in piega",
// disegnato speculare con la piega su x=0). Percio' le larghezze di riferimento
// sono METRI del giro, non quarti: W=(vita+easy)/2. Storicamente erano quarti,
// e la carta risultava meta' della taglia.
function gonna(v){
 const H4=(v.fianchi+v.agio)/2,W4=(v.vita+2)/2,d=Math.max(0,H4-W4),dw=d*v.pince/100,T=W4+dw,hd=v.hd,L=v.lung,F=v.svas;
 const mk=(nm,dl)=>({nm,note:'Taglio ×1 in piega',start:[0,0],dw,
  edges:[{n:'vita',p:[[T,0]]},{n:'fianco',p:[[T+(H4-T)*.15,hd*.4],[H4,hd*.5],[H4,hd]]},{n:'fianco',p:[[H4+F,L]]},{n:'orlo',p:[[0,L]]},{n:'piega',p:[[0,0]]}],
  darts:dw>.2?[[[T/2-dw/2,0],[T/2,dl],[T/2+dw/2,0]]]:[],con:[[[0,hd],[H4,hd]]],marks:[[[H4,hd],[H4+.9,hd]]],grain:[3.5,dl+4,L-6],lab:[6.5,L*.55]});
 const a=mk('Gonna davanti',10),b=mk('Gonna dietro',14);
 // le righe riassuntive MISURANO la carta, non riecheggiano l'input
 return{panels:[a,b],rows:[['Fianco',len(a,'fianco'),len(b,'fianco'),1],['Larghezza pince',dw,dw],
  ['Vita finita (carta)',giro(a,.05,dw)],['Fianchi finiti (carta)',giro(a,hd-.05)]]}}
function corpetto(v){
 const B=v.petto,E=v.agio,nw=B/20+3.5,AD=B/8+8.5,h=v.sp/2,q=(B+E)/2,Wq=(v.vita+4)/2,k=v.pince/100;
 const mk=fr=>{const xs=q+(fr?.5:-.5),wy=v.ld+(fr?.8:0),dt=Math.max(0,xs-Wq),dw=dt*k,xw=xs-(dt-dw),nx=fr?nw-.2:nw,sy=fr?2.2:2,cy=v.scollo-2,st=fr?[0,cy]:[0,0],bx=B/10,xd=xw*.55;
  const dart=dw>.2?[fr?[[bx-dw/2,wy],[bx,AD+3],[bx+dw/2,wy]]:[[xd-dw/2,wy],[xd,wy-13],[xd+dw/2,wy]]]:[];
  return{nm:fr?'Corpetto davanti':'Corpetto dietro',note:'Taglio ×1 in piega',start:st,dw,wy,AD,
   edges:[fr?{n:'scollo',p:[[nw*.55,cy],[nx,-2+(cy+2)*.55],[nx,-2]]}:{n:'scollo',p:[[nw*.6,0],[nx,-2]]},
    {n:'spalla',p:[[h,sy]]},
    fr?{n:'giromanica',p:[[h-1.8,AD*.4],[xs-4.5,AD-2],[xs,AD]]}:{n:'giromanica',p:[[h-.6,AD*.35],[xs-4,AD-3.5],[xs,AD]]},
    {n:'fianco',p:[[xw,wy]]},{n:'vita',p:[[0,wy]]},{n:'piega',p:[st]}],
   darts:dart,con:[[[0,AD],[xs,AD]]],marks:[[[xs,AD],[xs+.9,AD]]],grain:[3,AD*.6+2,wy-4],lab:[5.5,13]}};
 const f=mk(1),b=mk(0);
 // le righe riassuntive MISURANO la carta: il torace al massimo del pannello,
 // la vita sulla riga di vita (wy) meno i dart che li assorbono
 return{panels:[f,b],rows:[['Spalla',len(f,'spalla'),len(b,'spalla'),1],['Fianco',len(f,'fianco'),len(b,'fianco'),1],
  ['Larghezza pince',f.dw,b.dw],['Torace finito (carta)',giro(f,AD-.05)],['Vita finita (carta)',giro(f,f.wy-.05,f.dw)]]}}

// ---- t-shirt, felpa, pantaloni ----
const rc=(nm,w,h,note)=>({nm,note,nf:1,start:[0,0],edges:[[w,0],[w,h],[0,h],[0,0]].map((p,i)=>({n:'abcd'[i],p:[p]})),darts:[],con:[],marks:[],grain:[w/2,1.5,h-1.5],lab:[1,h/2+.4]});
function maglia(v,fe){
 const B=v.petto,q=(B+v.agio)/2,nw=B/20+3.5,h=v.sp/2,AD=B/8+(fe?11:9.5),sy=fe?3.5:2.2,cy=v.scollo-2,bh=fe?v.fascia:0,L=v.lung-bh;
 const mk=fr=>({nm:fr?'Davanti':'Dietro',note:'Taglio ×1 in piega',start:[0,fr?cy:0],
  edges:[fr?{n:'scollo',p:[[nw*.55,cy],[nw,-2+(cy+2)*.55],[nw,-2]]}:{n:'scollo',p:[[nw*.6,0],[nw,-2]]},{n:'spalla',p:[[h,sy]]},{n:'giromanica',p:[[h-1,AD*.4],[q-4,AD-2.5],[q,AD]]},{n:'fianco',p:[[q,L]]},{n:'orlo',p:[[0,L]]},{n:'piega',p:[[0,fr?cy:0]]}],
  darts:[],con:[[[0,AD],[q,AD]]],marks:[[[q,AD],[q+.9,AD]]],grain:[3,AD+4,L-6],lab:[6,AD+10]});
 const f=mk(1),b=mk(0),AH=len(f,'giromanica')+len(b,'giromanica'),bw=B/6+1+(fe?2:0),ow=v.omanica/2,sl=v.lm-bh;
 const sc=e=>({start:[0,0],edges:[{n:'t',p:[[bw*.45,0],[bw*.8,e*.4],[bw,e]]}]});
 // La manica e' tagliata x2 speculare sulla piega x=0: l'arco (0,0)->(bw,lo) e'
 // META' della testa manica, la copia speculare ne forma l'altra meta'. Quindi
 // 2*len(arco) = lunghezza della testa manica = (AH+ease)/2, e NON len(arco).
 // Risolgere per target (e non target/2) assegnava a ogni meta' tutta la
 // lunghezza della meta' giromanica: lo sfondava oltre sl e la testa manica
 // attraversava la cucitura dell'orlo (auto-intersezione a y=sl).
 //
 // Dominio di lo: (0, sl]. sl = lunghezza sotto-manica = lm - fascia. Non puo'
 // essere un tetto fisso come il vecchio hi=30: oltre sl l'arco scende dove sta
 // l'orlo e il bordo del pannello si incrocia. sl e' l'unico limite geometrico
 // reale, ed e' derivato dalla costruzione.
 const tgt=(AH+(fe?1.5:1))/4;
 let lo=0.01,hi=sl;
 for(let i=0;i<40;i++){const m=(lo+hi)/2;if(len(sc(m),'t')<tgt)lo=m;else hi=m}
 lo=Math.min(lo,sl);
 const s={nm:'Manica',note:'Taglio ×2 (uno speculare)',sym:1,start:[0,0],edges:[{n:'testa',p:[[bw*.45,0],[bw*.8,lo*.4],[bw,lo]]},{n:'sotto manica',p:[[ow,sl]]},{n:'orlo',p:[[0,sl]]},{n:'piega',p:[[0,0]]}],darts:[],con:[[[0,lo],[bw,lo]]],marks:[],grain:[0,lo+3,sl-4],lab:[3,lo+9]};
 const nl=2*(len(f,'scollo')+len(b,'scollo')),P=[f,b,s,rc('Bordo collo',nl*.85,4,'Taglio ×1, elastico')];
 if(fe)P.push(rc('Fascia orlo',q*1.7,2*bh,'Taglio ×2'),rc('Polsino',ow*1.7,2*bh,'Taglio ×2'));
 return{panels:P,T:[[f,b,'t']],ref:'n',S:{p:s},rows:[['Spalla',len(f,'spalla'),len(b,'spalla'),1],['Fianco',len(f,'fianco'),len(b,'fianco'),1],['Giromanica totale',AH],['Testa manica (con agio)',2*len(s,'testa')],['Torace finito (carta)',giro(f,AD-.05)]]}}
function pant(v){
 const E=v.agio,Hq=(v.fianchi+E)/4,W2=(v.vita+2)/4,R=v.cavallo,L=v.lung,hd=Math.min(20,R-5),k=v.pince/100;
 const mk=fr=>{const h=Hq+(fr?-1:1),e=(v.fianchi+E)/(fr?16:10),d=Math.max(0,h-(W2+(fr?-1:1))),dw=d*k,s=d-dw+(fr?0:1.5),c=(h+e)/2,fw=v.orlo/2+(fr?-1:1),cy=fr?0:-2,
  // il bordo vita e' ancorato al QUARTO VITA (W2), non al quarto fianchi:
  // la carta deve girare come il vita. cwt = angolo vita, cwt-cw = W2+dw.
  cwt=s+W2+dw,xd=(s+cwt)/2;
  return{nm:fr?'Pantalone davanti':'Pantalone dietro',note:'Taglio ×2 (uno speculare)',nf:1,dw,s,cwt,start:[s,0],

 if(!TD||!CB)return;const{piv,g}=TD,rx=piv.rotation.x,ry=piv.rotation.y,M=body(),H=M.H,lo=M.TR[M.TR.length-1][0];
 while(g.children.length){const ch=g.children[0];ch.traverse(o=>{o.geometry&&o.geometry.dispose();o.material&&o.material.dispose()});g.remove(ch)}
 if(S.mn.sh)mannequin(M,g);
 const nz=CB.ref=='n',Y0=(nz?143:105)*H,hs=nz?134*H:1e9,
  tb=Y=>{const t=Y>=lo?lp(M.TR,Y):(l=>[l[0]+l[1],l[1]])(lp(M.LG,Y));return[t[0],t[1]]},
  lg=Y=>{if(Y>=lo){const t=lp(M.TR,Y);return[t[0]/2,t[1],t[0]/2]}const t=lp(M.LG,Y);return[t[1],t[1],t[0]]},
  add=(pg,u)=>pg.forEach(([p,geo])=>u.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:tex(p),roughness:.9,side:THREE.DoubleSide}))));
 for(const[a,b,k]of CB.T)add(surf(a,b,k=='l'?{Y0,hs:1e9,leg:1,bd:lg}:{Y0,hs,bd:tb}),g);
 if(CB.S)for(const s of[1,-1]){const u=new THREE.Group();
  add(surf(CB.S.p,null,{Y0:0,hs:1e9,bd:(Y,y)=>{const r=4.6*M.B/88*(1-.35*Math.min(1,y/(62*H)));return[r,r]}}),u);
  u.position.set(s*M.sp*.46,139*H,0);u.rotation.z=s*ARM*Math.PI/180;g.add(u)}
 piv.rotation.set(0,0,0);g.position.set(0,0,0);piv.updateMatrixWorld(true);
 // La cache della camera dipende dalla geometria GENERATA. Prima bastava la
  // taglia del manichino; ora il corpo deriva dalle misure del capo, quindi
  // la chiave deve cambiare anche quando cambiano i valori digitati.
  const key=S.g+Object.values(S.v[S.g]).join(',')+S.mn.sh;
 if(TD.key!=key){const bx=new THREE.Box3().setFromObject(g),z=bx.getSize(new THREE.Vector3());TD.c=bx.getCenter(new THREE.Vector3()).negate();TD.key=key;TD.d=Math.max(z.y*1.1,z.x*1.1/TD.cam.aspect)/(2*Math.tan(TD.cam.fov*Math.PI/360))+z.z}
 g.position.copy(TD.c);piv.rotation.set(rx,ry,0);draw3()}
const ld=cb=>{if(window.THREE)return cb();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';s.onload=cb;s.onerror=()=>say('Motore 3D non caricato: controlla la connessione.');document.head.appendChild(s)};
$('#tb').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;S.t3=b.dataset.v=='3d';
 $('#tb').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x==b));
 cv.toggleAttribute('hidden',S.t3);$('#v3').hidden=!S.t3;$('.zb').hidden=S.t3;$('#ex').hidden=S.t3||!DL;$('#mn').hidden=!S.t3;
 $('.hint').textContent=S.t3?'Trascina per ruotare, rotella per avvicinare. L’anteprima avvolge i pezzi su un volume semplificato.':'Trascina per spostare, rotella per ingrandire. Griglia: 1 cm e 10 cm.';
 if(S.t3)ld(()=>{if(!TD)init3();if(TD){size3();m3()}});else fit()};
addEventListener('resize',()=>{if(S.t3&&TD){size3();m3()}});
// ---- immagini sui pezzi e manichino ----
function fillIp(){const k=$('#ip').value;$('#ip').innerHTML=CB.panels.map(p=>`<option>${p.nm}</option>`).join('');if(CB.panels.some(p=>p.nm==k))$('#ip').value=k;sync()}
const ik=()=>S.g+':'+$('#ip').value,IK=[['iw','w'],['ir','r'],['ix','ox'],['iy','oy']];
function sync(){const I=IM[ik()];$('#ic').hidden=!I;if(I)IK.forEach(([d,k])=>{$('#'+d).value=I[k];$('#o'+d).textContent=I[k]})}
$('#ip').onchange=sync;
$('#if').onchange=e=>{const f=e.target.files[0];if(!f)return;const R=new FileReader();R.onload=()=>{const im=new Image();im.onload=()=>{
 const k=ik(),p=CB.panels.find(q=>q.nm==$('#ip').value),b=bb(p),sc=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 IM[k]={src:c.toDataURL(f.type=='image/png'?'image/png':'image/jpeg',.85),img:c,id:++uid,h:c.height/c.width,w:Math.round(b[2]-b[0]),r:0,ox:0,oy:0};sync();render()};im.src=R.result};R.readAsDataURL(f);e.target.value=''};
IK.forEach(([d,k])=>$('#'+d).oninput=e=>{const I=IM[ik()];if(!I)return;I[k]=+e.target.value;$('#o'+d).textContent=I[k];render()});
$('#ib').onclick=()=>{delete IM[ik()];sync();render()};
// La tabella del manichino mostra i valori che il 3D USA DAVVERO, non la riga
 // di SZ: senza questo l'utente legge 'Torace 88' mentre il corpo e' costruito
 // sul suo torace digitato. La provenienza ('dal capo' / 'taglia NN') dichiara
 // da dove viene ogni valore, e rende esplicito il ripiego su SZ.
 function mtab(){const{B,W,Hp,sp,al,src}=bodyDims(),[z,sz]=SZ[S.mn.sz],m=s=>s==='SZ'?`taglia ${S.mn.sz} (ripiego)`:'dal capo';
  $('#mt').innerHTML='<table>'+[['Altezza',al,src.al],['Torace',B,src.B],['Vita',W,src.W],['Fianchi',Hp,src.Hp],['Spalle',sp,src.sp],['Collo',33+(B-80)*.2,null],['Coscia',Hp*.58,null]].map(r=>`<tr><td>${r[0]}</td><td>${nf(r[1])} cm</td><td style="font-size:.55rem;opacity:.6">${r[2]?m(r[2]):'derivato'}</td></tr>`).join('')+'</table>'}
 // Non e' piu' la sincronizzazione: il corpo deriva gia' dalle misure del capo.
 // Il pulsante resta come azione esplicita "ripristina i valori di taglia",
 // utile per ripartire da un riferimento noto.
 $('#ma').onclick=()=>{const v=S.v[S.g],[B,W,H,sp]=[SZ[S.mn.sz][0],SZ[S.mn.sz][1],SZ[S.mn.sz][2],SZ[S.mn.sz][3]];
  if('petto'in v)v.petto=B;if('vita'in v)v.vita=W;if('fianchi'in v)v.fianchi=H;if('sp'in v)v.sp=sp;
  form();render();mtab();save();say('Misure ripristinate sui valori della taglia '+S.mn.sz+'.')};
$('#mn').addEventListener('input',e=>{const i=e.target,M=S.mn;
 if(i.id=='ms'){M.sz=+i.value;mtab()}else if(i.id=='msh')M.sh=i.checked;else if(i.id=='fc')S.fc=i.value;
 else if(i.dataset.d){M[i.dataset.d]=i.value/100;$('#o'+i.id).textContent=i.value+'%'}else return;m3()});
form();render();fillIp();mtab();requestAnimationFrame(fit);
 // Accesso in sola lettura allo stato interno, per i test. Non e' usato dall'app:
 // serve solo a ispezionare il percorso REALE (CB/TD) che vive nel closure dello
 // script e non e' raggiungibile da window. Nessuna logica dipende da questo.
 window.__t={CB:()=>CB,TD:()=>TD,S:()=>S,setTD:v=>{TD=v},lp};
 </script>
